<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<meta name="description" content="فایزنس؛ پیام رسان گیمری مدرن برای گفتگو، گروه و ارتباط با گیمرها.">
<title>فایزنس | Fiezens</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#eef2ff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}
:root{--card:#0d121c;--line:#1b2434;--muted:#8d99ad;--accent:#7c5cff;--accent2:#00d4ff}
.app{max-width:1200px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;background:#080b12ee;backdrop-filter:blur(16px);z-index:5}
.logo{font-weight:900;font-size:25px;letter-spacing:.5px}.logo span{color:var(--accent)}
.search{flex:1;max-width:430px;margin-right:auto}.search input{width:100%;background:#0c111b;border:1px solid var(--line);border-radius:13px;padding:11px 15px;color:white;outline:none}.search input:focus{border-color:var(--accent)}
main{display:grid;grid-template-columns:235px 1fr 250px;gap:14px;padding:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sidebar{padding:12px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#aeb8ca;text-align:right;padding:12px;border-radius:11px}.nav button.active,.nav button:hover{background:#151b2a;color:white}
.channels{margin-top:18px}.caption{font-size:11px;color:#657187;padding:8px 10px}.channel{padding:10px;border-radius:10px;color:#aab5c8;cursor:pointer}.channel:hover{background:#121927;color:white}
.chat{min-height:620px;display:flex;flex-direction:column}.chathead{padding:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chatname{font-weight:bold}.status{font-size:11px;color:#48df9b;margin-top:4px}
.messages{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}.msg{max-width:75%;padding:11px 14px;border:1px solid var(--line);background:#111722;border-radius:15px 15px 4px 15px;align-self:flex-start}.msg.me{align-self:flex-end;background:#17132b;border-color:#30265c;border-radius:15px 15px 15px 4px}.author{font-size:11px;color:#9c8cff;margin-bottom:5px}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;background:#090d15;border:1px solid var(--line);border-radius:12px;padding:12px;color:white;outline:0}.send{border:0;background:linear-gradient(135deg,var(--accent),#5a39d7);color:white;border-radius:12px;padding:0 18px;font-weight:bold}
.profile{padding:18px;text-align:center}.avatar{width:74px;height:74px;border-radius:22px;margin:5px auto 12px;background:linear-gradient(135deg,#7c5cff,#00d4ff);display:grid;place-items:center;font-size:27px;font-weight:900}.level{margin-top:14px;background:#111722;border-radius:12px;padding:11px;text-align:right}.bar{height:6px;background:#252d3c;border-radius:8px;margin-top:8px;overflow:hidden}.bar i{display:block;width:64%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.online{margin-top:14px;padding:15px}.person{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #151d2a}.dot{width:8px;height:8px;border-radius:50%;background:#43df98}.muted{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#151c29;border:1px solid #29354b;padding:11px 17px;border-radius:12px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:#4f5b70;font-size:9px;padding:12px}
@media(max-width:900px){main{grid-template-columns:190px 1fr}.right{display:none}}
@media(max-width:650px){header{height:62px;padding:0 12px}.logo{font-size:19px}.search{display:none}main{display:block;padding:8px}.sidebar{display:none}.chat{min-height:calc(100vh - 105px)}footer{display:none}.messages{padding:12px}.msg{max-width:88%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<style>.authbox{position:fixed;inset:0;background:#05070ccc;backdrop-filter:blur(12px);display:none;place-items:center;z-index:50}.authbox.show{display:grid}.authcard{width:min(92vw,410px);background:#0d121c;border:1px solid #273149;border-radius:22px;padding:22px;box-shadow:0 20px 70px #000}.authcard h2{margin:0 0 8px}.authcard input{width:100%;margin:6px 0;background:#080d15;border:1px solid #263148;color:white;border-radius:11px;padding:12px;outline:0}.authactions{display:flex;gap:8px;margin-top:10px}.authactions button{flex:1;padding:11px;border-radius:11px;border:0}.primary{background:#7c5cff;color:#fff}.secondary{background:#171e2c;color:#b9c4d8}.profileEdit{margin-top:12px;display:none}.userline{cursor:pointer}.userline:hover{background:#141b29;border-radius:9px;padding-right:6px}.logout{margin-top:12px;width:100%;padding:10px;border:1px solid #273149;background:#101622;color:#b9c4d8;border-radius:10px}</style>\n</head>
<body>
<div class="app">
<header><div class="logo">فــایــزنـس <span>𝗙𝗶𝗲𝘇𝗲𝗻𝘀</span></div><div class="search"><input id="search" placeholder="جستجوی گیمر، گروه یا پیام..."></div></header>
<main>
<aside class="panel sidebar">
<div class="nav">
<button class="active" data-view="messages">💬 پیام ها</button><button data-view="friends">👥 دوستان</button><button data-view="notifications">🔔 اعلان ها</button><button data-view="achievements">🏆 دستاوردها</button>
</div>
<div class="channels"><div class="caption">کانال ها</div><div class="channel" data-channel="لابی گیمرها">🎮 لابی گیمرها</div><div class="channel" data-channel="Minecraft">⛏️ Minecraft</div><div class="channel" data-channel="Valorant">🎯 Valorant</div><div class="channel" data-channel="گپ آزاد">🔥 گپ آزاد</div></div>
</aside>
<section class="panel chat">
<div class="chathead"><div><div class="chatname" id="chatName">🎮 لابی گیمرها</div><div class="status">● آنلاین · گفتگوی عمومی</div></div><button id="clear" style="background:transparent;color:#8d99ad;border:0">پاک کردن</button></div>
<div class="messages" id="messages"></div>
<div class="composer"><input id="message" placeholder="پیامت را بنویس..."><button class="send" id="send">ارسال</button></div>
</section>
<aside class="right">
<div class="panel profile"><div class="avatar" id="avatar">FZ</div><b id="profileName">Gamer</b><div class="muted" id="profileUser">مهمان</div><div class="level"><b id="levelText">Level 1</b><span class="muted" id="xpText" style="float:left">0 XP</span><div class="bar"><i id="xpBar"></i></div></div><button class="logout" id="authBtn">ورود / ثبت نام</button></div>
<div class="panel online"><b id="onlineTitle">بازیکنان</b><div id="people"><div class="person"><i class="dot"></i> در حال بارگذاری...</div></div></div>
</aside>
</main>
<footer>Fiezens · پیام رسان گیمری · نسخه 1.0.4</footer>
</div>
<div class="toast" id="toast"></div>
<div class="authbox" id="authBox">
  <div class="authcard">
    <h2>ورود به فایزنس</h2>
    <div class="muted">برای استفاده از حساب و چت خصوصی وارد شو.</div>
    <input id="authEmail" type="email" placeholder="ایمیل">
    <input id="authPassword" type="password" placeholder="رمز عبور">
    <input id="authUsername" type="text" placeholder="نام کاربری (برای ثبت نام)">
    <div class="authactions"><button class="primary" id="loginBtn">ورود</button><button class="secondary" id="signupBtn">ثبت نام</button></div>
    <button class="logout" id="closeAuth">بستن</button>
  </div>
</div>
<script>
const SUPABASE_URL='https://pwwicgyrycaexjnnhseb.supabase.co';
const SUPABASE_KEY='sb_publishable_CiQbGJJx_WGbeGTPssoWYQ_kutyUJh9';
let supabaseClient=null,session=null,profile=null,privateMode=false,privateUser=null,channel='لابی گیمرها';

document.addEventListener('DOMContentLoaded',()=>{
  const $=id=>document.getElementById(id);
  const messages=$('messages'),input=$('message'),toast=$('toast'),nameEl=$('chatName');
  const nickname=localStorage.getItem('fiezens-nickname')||'Gamer';

  function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.fzToast);window.fzToast=setTimeout(()=>toast.classList.remove('show'),1800)}
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function render(list=[]){
    if(!list.length) list=[{nickname:'BROТEX',content:'بالاخره لابی فایزنس آماده شد 🎮'},{nickname:'Nevar',content:'سلام! اینجا میتونیم درباره بازی ها گپ بزنیم.'}];
    messages.innerHTML=list.map(m=>'<div class="msg '+(m.nickname===(profile?.display_name||nickname)?'me':'')+'"><div class="author">'+esc(m.nickname)+'</div>'+esc(m.content)+'</div>').join('');
    messages.scrollTop=messages.scrollHeight;
  }

  function setProfile(){
    const p=profile||{};
    $('profileName').textContent=p.display_name||'مهمان';
    $('profileUser').textContent=p.username?'@'+p.username:'وارد نشده';
    $('levelText').textContent='Level '+(p.level||1);
    $('xpText').textContent=(p.xp||0)+' XP';
    $('xpBar').style.width=Math.min(100,((p.xp||0)%1000)/10)+'%';
    $('authBtn').textContent=session?'خروج':'ورود / ثبت نام';
  }

  function openAuth(){ $('authBox').classList.add('show'); $('authEmail').focus(); }

  async function connect(){
    if(!window.supabase?.createClient){show('در حال اتصال به سرویس...');return false}
    if(!supabaseClient) supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    return true;
  }

  async function loadMessages(){
    if(privateMode)return;
    if(!await connect()){render();return}
    const r=await supabaseClient.from('fiezens_messages').select('id,channel,nickname,content,created_at').eq('channel',channel).order('created_at',{ascending:true}).limit(200);
    if(r.error){render();show('اتصال به سرور برقرار نشد');return}
    render(r.data||[]);
  }

  async function loadProfile(){
    if(!await connect())return;
    const r=await supabaseClient.auth.getSession();
    session=r.data?.session||null;
    if(!session){profile=null;setProfile();return}
    const p=await supabaseClient.from('fiezens_profiles').select('*').eq('id',session.user.id).maybeSingle();
    profile=p.data||null;setProfile();loadPeople();
  }

  async function loadPeople(){
    if(!await connect())return;
    const r=await supabaseClient.from('fiezens_profiles').select('id,username,display_name,level').order('display_name').limit(30);
    const box=$('people');
    box.innerHTML=(r.data||[]).filter(p=>p.id!==session?.user?.id).map(p=>'<div class="person userline" data-id="'+esc(p.id)+'"><i class="dot"></i> '+esc(p.display_name)+' <span class="muted">@'+esc(p.username)+' · LV '+p.level+'</span></div>').join('')||'<div class="muted" style="padding-top:10px">کاربر دیگری پیدا نشد.</div>';
    box.querySelectorAll('.userline').forEach(el=>el.addEventListener('click',()=>openPrivate(el.dataset.id)));
  }

  async function openPrivate(id){
    if(!session){show('ابتدا وارد حساب شو');openAuth();return}
    const r=await supabaseClient.from('fiezens_profiles').select('id,username,display_name').eq('id',id).single();
    if(r.error){show('کاربر پیدا نشد');return}
    privateMode=true;privateUser=r.data;nameEl.textContent='💬 '+privateUser.display_name;await loadPrivate();
  }

  async function loadPrivate(){
    if(!privateMode||!privateUser||!session)return;
    const a=session.user.id,b=privateUser.id;
    const r=await supabaseClient.from('fiezens_private_messages').select('id,sender_id,receiver_id,content,created_at').or('and(sender_id.eq.'+a+',receiver_id.eq.'+b+'),and(sender_id.eq.'+b+',receiver_id.eq.'+a+')').order('created_at',{ascending:true}).limit(200);
    if(r.error){show('چت خصوصی در دسترس نیست');return}
    messages.innerHTML=(r.data||[]).map(m=>'<div class="msg '+(m.sender_id===a?'me':'')+'"><div class="author">'+(m.sender_id===a?'من':'از '+esc(privateUser.display_name))+'</div>'+esc(m.content)+'</div>').join('');
    messages.scrollTop=messages.scrollHeight;
  }

  async function auth(mode){
    if(!await connect())return;
    const email=$('authEmail').value.trim(),password=$('authPassword').value,username=$('authUsername').value.trim()||'gamer';
    if(!email||!password){show('ایمیل و رمز عبور را وارد کن');return}
    const r=mode==='login'
      ? await supabaseClient.auth.signInWithPassword({email,password})
      : await supabaseClient.auth.signUp({email,password,options:{data:{username,display_name:username}}});
    if(r.error){show(r.error.message);return}
    $('authBox').classList.remove('show');await loadProfile();show(mode==='login'?'وارد شدی':'حساب ساخته شد');
  }

  async function send(){
    const text=input.value.trim();if(!text)return;
    if(!await connect())return;
    if(privateMode){
      if(!session||!privateUser){show('ابتدا وارد حساب شو');return}
      const r=await supabaseClient.from('fiezens_private_messages').insert({sender_id:session.user.id,receiver_id:privateUser.id,content:text});
      if(r.error)show('ارسال پیام خصوصی ناموفق بود');else{input.value='';await loadPrivate()}
      return;
    }
    const r=await supabaseClient.from('fiezens_messages').insert({channel,nickname:profile?.display_name||nickname,content:text});
    if(r.error)show('ارسال پیام ناموفق بود');else input.value='';
  }

  $('send').addEventListener('click',send);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
  $('authBtn').addEventListener('click',async()=>{
    if(!session){openAuth();return}
    if(await connect())await supabaseClient.auth.signOut();
    session=null;profile=null;privateMode=false;privateUser=null;setProfile();show('از حساب خارج شدی');
  });
  $('loginBtn').addEventListener('click',()=>auth('login'));
  $('signupBtn').addEventListener('click',()=>auth('signup'));
  $('closeAuth').addEventListener('click',()=>$('authBox').classList.remove('show'));
  $('authBox').addEventListener('click',e=>{if(e.target.id==='authBox')$('authBox').classList.remove('show')});
  $('clear').addEventListener('click',loadMessages);

  document.querySelectorAll('.channel').forEach(el=>el.addEventListener('click',()=>{
    privateMode=false;privateUser=null;channel=el.dataset.channel;nameEl.textContent='🎮 '+channel;loadMessages();
  }));

  document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.view==='friends'){loadPeople();show('برای شروع روی یک بازیکن بزن')}
    else show('بخش «'+btn.textContent.trim().replace(/^\S+\s*/,'')+'» به زودی کامل می شود');
  }));

  $('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())show('جستجو برای «'+e.target.value.trim()+'» آماده شد')});

  setProfile();
  render();
  loadMessages();
  loadProfile();

  const waitForSupabase=setInterval(()=>{
    if(window.supabase?.createClient){
      clearInterval(waitForSupabase);
      connect().then(()=>{
        supabaseClient.channel('fiezens-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'fiezens_messages'},p=>{if(!privateMode&&p.new.channel===channel)loadMessages()}).subscribe();
        supabaseClient.channel('fiezens-private-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'fiezens_private_messages'},p=>{if(privateMode&&session&&(p.new.sender_id===session.user.id||p.new.receiver_id===session.user.id))loadPrivate()}).subscribe();
        loadProfile();
      });
    }
  },250);
  setTimeout(()=>clearInterval(waitForSupabase),10000);
});
</script>
</body>
</html>
