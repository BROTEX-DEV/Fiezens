<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0878d1"><title>BROTEX OS</title>
<style>
:root{--accent:#1686d9;--glass:#172638df;--line:#ffffff24;--text:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);height:100dvh;overflow:hidden;background:#071b35}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.desktop{height:100%;position:relative;background:linear-gradient(135deg,#063b70,#0879b8 48%,#142b62);overflow:hidden}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 35%,#36b9ee77,transparent 42%),linear-gradient(120deg,transparent 45%,#ffffff12 46%,transparent 70%);pointer-events:none}.icons{position:absolute;top:16px;right:14px;display:grid;gap:18px}.deskicon{width:82px;background:transparent;text-align:center;padding:8px;border-radius:8px;font-size:12px;text-shadow:0 1px 4px #000}.deskicon:hover{background:#ffffff22}.deskicon span{display:block;font-size:34px;margin-bottom:6px}.taskbar{position:absolute;bottom:0;left:0;right:0;height:54px;background:#101d2ddd;backdrop-filter:blur(20px);border-top:1px solid #ffffff25;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:1000}.startbtn,.taskbtn{height:40px;min-width:42px;border-radius:8px;background:#ffffff12;font-size:21px}.startbtn:hover,.taskbtn:hover{background:#ffffff28}.taskapps{display:flex;gap:5px;flex:1;overflow:auto}.taskapp{height:38px;padding:0 12px;background:#ffffff12;border-radius:7px;font-size:12px;white-space:nowrap}.clock{font-size:12px;line-height:1.6;text-align:center;min-width:65px}.startmenu{position:absolute;bottom:62px;right:10px;width:min(360px,calc(100vw - 20px));padding:18px;background:#14263bed;backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:14px;z-index:1100;box-shadow:0 15px 50px #0008}.startmenu[hidden]{display:none}.starthead{font-weight:bold;margin-bottom:14px}.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.appitem{padding:12px 5px;background:#ffffff0d;border-radius:9px;text-align:center;font-size:12px}.appitem span{display:block;font-size:27px;margin-bottom:7px}.window{position:absolute;top:10%;left:12%;width:min(680px,88vw);height:min(480px,72vh);min-width:260px;min-height:190px;background:#f4f7fb;color:#172333;border-radius:10px;box-shadow:0 18px 60px #0008;overflow:hidden;display:flex;flex-direction:column;resize:both;z-index:10}.window.max{top:0!important;left:0!important;width:100%!important;height:calc(100% - 54px)!important;resize:none;border-radius:0}.winhead{height:42px;flex:none;background:#e7edf5;display:flex;align-items:center;padding:0 10px;gap:10px;cursor:move;user-select:none}.wintitle{flex:1;font-size:13px;font-weight:bold}.wincontrols{display:flex;gap:5px}.wincontrols button{width:28px;height:27px;border-radius:5px;background:#d5dfeb;color:#172333}.wincontrols button:last-child{background:#e55b62;color:white}.winbody{flex:1;min-height:0;overflow:auto;padding:14px;background:#f7f9fc;color:#172333}.winbody input,.winbody textarea{color:#172333}.notearea{width:100%;height:100%;min-height:150px;border:0;outline:0;resize:none;background:transparent;font:14px/1.9 Tahoma;padding:5px}.explorerbar{display:flex;gap:8px;margin-bottom:12px}.ui-btn{padding:8px 12px;border-radius:6px;background:#dce8f5;color:#17324e}.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px}.fileitem{padding:12px 5px;text-align:center;border-radius:8px;background:#eaf0f7;cursor:pointer;font-size:12px}.fileitem span{display:block;font-size:30px;margin-bottom:7px}.calc{max-width:320px;margin:auto}.calcdisplay{width:100%;padding:18px;text-align:left;font-size:26px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;background:white}.calckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calckeys button{padding:15px 4px;background:#e2eaf3;border-radius:7px;color:#14283d;font-size:17px}.calckeys button.op{background:#c6e4fa}.browserbar{display:flex;gap:6px}.browserbar input{flex:1;min-width:0;padding:9px;border:1px solid #cbd5e1;border-radius:6px}.browserhint{padding:24px;text-align:center;color:#536579;line-height:2}.settingsrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #dbe3ed}.toast{position:absolute;bottom:70px;left:15px;background:#14263bed;padding:10px 16px;border-radius:8px;font-size:12px;z-index:1200;display:none}@media(max-width:600px){.window{left:3%!important;top:6%!important;width:94vw!important;height:78vh!important}.window.max{height:calc(100% - 54px)!important}.icons{top:8px;right:6px;gap:8px}.deskicon{width:68px}.taskbar{height:52px}.clock{font-size:10px}}

/* Windows 11 inspired taskbar and Fluent-style icon system */
:root{--task:#101827d9;--task-hover:#ffffff20;--task-active:#ffffff30}
.taskbar{height:64px;left:0;right:0;justify-content:center;gap:7px;padding:0 14px;background:var(--task);backdrop-filter:blur(28px) saturate(1.5);border-top:1px solid #ffffff26;box-shadow:0 -8px 30px #0002}
.task-center{display:flex;align-items:center;justify-content:center;gap:6px;flex:0 1 auto;min-width:0}
.taskbtn,.startbtn{width:44px;height:44px;min-width:44px;border-radius:11px;background:transparent;display:grid;place-items:center;transition:background .18s,transform .18s}
.taskbtn:hover,.startbtn:hover{background:var(--task-hover);transform:translateY(-2px)}
.startbtn svg{width:25px;height:25px}
.taskapps{display:flex;flex:0 1 auto;gap:5px;overflow:visible}
.taskapp{height:44px;min-width:44px;padding:0 10px;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;position:relative}
.taskapp:hover{background:var(--task-hover)}
.taskapp:before{content:"";position:absolute;bottom:3px;width:5px;height:3px;border-radius:5px;background:#60b9ff}
.taskapp svg{width:23px;height:23px}
.task-search{height:40px;display:flex;align-items:center;gap:8px;padding:0 13px;border-radius:22px;background:#ffffff14;border:1px solid #ffffff20;color:#eaf4ff;font-size:12px;min-width:115px}
.task-search svg{width:17px;height:17px}
.system-tray{position:absolute;right:12px;display:flex;align-items:center;gap:12px;height:100%}
.tray-icons{display:flex;align-items:center;gap:9px;color:#f2f7ff}
.tray-icons svg{width:17px;height:17px}
.clock{font-size:11px;line-height:1.55;min-width:75px}
.deskicon{display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 1px 4px #000}
.deskicon svg{width:39px;height:39px;filter:drop-shadow(0 3px 5px #0018)}
.appitem{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px}
.appitem svg{width:30px;height:30px}
.winhead .app-symbol{width:18px;height:18px}
@media(max-width:650px){.taskbar{height:60px;justify-content:center;padding:0 8px}.system-tray{display:none}.task-search{min-width:40px;width:40px;padding:0;justify-content:center;font-size:0}.task-center{gap:2px}.taskbtn,.startbtn{width:40px;min-width:40px;height:42px}.taskapp{min-width:40px;padding:0 7px}.taskapp .task-label{display:none}.clock{display:none}}
</style></head>
<body><main class="desktop" id="desktop"><div class="wall"></div>
<div class="icons"><button class="deskicon" data-app="explorer">فایل‌ها</button><button class="deskicon" data-app="notes">یادداشت‌ها</button><button class="deskicon" data-app="browser">مرورگر</button><button class="deskicon" data-app="calculator">ماشین‌حساب</button></div>
<div id="windows"></div><section class="startmenu" id="startmenu" hidden><div class="starthead">BROTEX OS　 |　 برنامه‌ها</div><div class="appgrid"><button class="appitem" data-app="explorer">ICONFILESفایل‌ها</button><button class="appitem" data-app="notes">ICONNOTESیادداشت‌ها</button><button class="appitem" data-app="calculator">ICONCALCماشین‌حساب</button><button class="appitem" data-app="browser">ICONBROWSERمرورگر</button><button class="appitem" data-app="settings">ICONSETTINGSتنظیمات</button><button class="appitem" data-app="about">ICONABOUTدرباره سیستم</button></div></section>
<footer class="taskbar"><div class="task-center"><button class="startbtn" id="startbtn" title="شروع">STARTICON</button><button class="taskbtn" title="جست‌وجو" id="searchbtn">SEARCHICON</button><button class="taskbtn" title="نمای وظایف" id="viewbtn">VIEWICON</button><div class="taskapps" id="taskapps"></div></div><div class="system-tray"><div class="tray-icons">WIFIICONVOLUMEICONBATTERYICON</div><div class="clock" id="clock"></div></div></footer><div class="toast" id="toast"></div></main>
<script>
const $=s=>document.querySelector(s), windows=$('#windows'), start=$('#startmenu');let z=20,seq=0;
const iconPaths={
start:'<path d="M2 3.5 10.5 2v8H2zm10  -1.7L22 0v10h-10zM2 12h8.5v8L2 18.5zm10 0h10v10l-10-1.5z"/>',
files:'<path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10l2 2h6.5A2.5 2.5 0 0 1 21 7.5v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 8h18" />',
notes:'<path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 12h8M8 16h8"/>',
browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
calculator:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6h8M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M8 19h1m3 0h1m3 0h1"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/>',
about:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
view:'<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/>',
wifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0m-11 3.5a5 5 0 0 1 8 0M12 19h.01"/>',
volume:'<path d="M3 10v4h4l5 4V6l-5 4z"/><path d="M16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/>',
battery:'<rect x="3" y="7" width="17" height="10" rx="2"/><path d="M22 10v4M6 10h10v4H6z"/>'
};
function ico(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(iconPaths[name]||iconPaths.about)+'</svg>'}
const appIcons={explorer:'files',notes:'notes',browser:'browser',calculator:'calculator',settings:'settings',about:'about'};
const titles={explorer:'فایل اکسپلورر',notes:'دفترچه یادداشت',calculator:'ماشین‌حساب',browser:'مرورگر وب',settings:'تنظیمات',about:'درباره BROTEX OS'};
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('bxos_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('bxos_'+k,JSON.stringify(v));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function appContent(id){if(id==='notes')return '<textarea class="notearea" id="noteText" placeholder="یادداشت خود را بنویسید...">'+escapeHtml(read('note',''))+'</textarea><div style="font-size:11px;color:#718096">ذخیره‌سازی خودکار روی همین دستگاه فعال است.</div>';
if(id==='explorer')return '<div class="explorerbar"><button class="ui-btn" id="newfile">＋ فایل متنی جدید</button><button class="ui-btn" id="newfolder">＋ پوشه جدید</button></div><div class="filegrid" id="filegrid"></div>';
if(id==='calculator')return '<div class="calc"><input class="calcdisplay" id="calcdisplay" value="0" readonly><div class="calckeys">'+['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map((x,i)=>'<button class="'+([3,7,11,15,19].includes(i)?'op':'')+'" data-key="'+x+'">'+x+'</button>').join('')+'</div></div>';
if(id==='browser')return '<div class="browserbar"><input id="browserurl" value="https://example.com" placeholder="نشانی وب‌سایت"><button class="ui-btn" id="browsergo">برو</button></div><div class="browserhint">🌐 مرورگر داخلی BROTEX OS<br>برای امنیت، بعضی وب‌سایت‌ها اجازه نمایش داخل پنجره را نمی‌دهند.<br><button class="ui-btn" id="external">باز کردن در زبانه جدید</button><div id="browserframe"></div></div>';
if(id==='settings')return '<h3>شخصی‌سازی</h3><div class="settingsrow"><span>رنگ پس‌زمینه</span><input type="color" id="wallcolor" value="'+read('color','#0879b8')+'"></div><div class="settingsrow"><span>اندازه ساعت</span><span>خودکار</span></div><div class="settingsrow"><span>پاک کردن یادداشت‌ها</span><button class="ui-btn" id="clearnote">پاک کردن</button></div>';
return '<div style="text-align:center;padding:35px"><div style="font-size:65px">💻</div><h2>BROTEX OS</h2><p>یک محیط دسکتاپ شبیه‌سازی‌شده با ابزارهای واقعی داخل مرورگر.</p><p>نسخه 1.0 · ساخته‌شده برای BROTEX</p><small>فایل‌ها و یادداشت‌ها در حافظه مرورگر همین دستگاه ذخیره می‌شوند.</small></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(id){start.hidden=true;const old=document.querySelector('[data-window="'+id+'"]');if(old){old.style.display='flex';old.style.zIndex=++z;return}const w=document.createElement('section');w.className='window';w.dataset.window=id;w.style.zIndex=++z;w.style.left=(12+(seq%5)*4)+'%';w.style.top=(9+(seq%5)*3)+'%';seq++;w.innerHTML='<header class="winhead"><span>▣</span><span class="wintitle">'+titles[id]+'</span><div class="wincontrols"><button data-act="min">—</button><button data-act="max">□</button><button data-act="close">×</button></div></header><div class="winbody">'+appContent(id)+'</div>';windows.append(w);wireWindow(w,id);updateTasks()}
function wireWindow(w,id){const head=w.querySelector('.winhead');let drag=null;head.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('max'))return;drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};head.setPointerCapture(e.pointerId);w.style.zIndex=++z});head.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-drag.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-80,e.clientY-drag.y))+'px'});head.addEventListener('pointerup',()=>drag=null);w.addEventListener('pointerdown',()=>w.style.zIndex=++z);w.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(b.dataset.act==='close'){w.remove();updateTasks()}if(b.dataset.act==='min'){w.style.display='none';updateTasks()}if(b.dataset.act==='max')w.classList.toggle('max')});
if(id==='notes'){const n=w.querySelector('#noteText');n.addEventListener('input',()=>write('note',n.value))}
if(id==='explorer')renderFiles(w);
if(id==='calculator')wireCalc(w);
if(id==='browser'){const go=()=>{let u=w.querySelector('#browserurl').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;w.querySelector('#browserurl').value=u;w.querySelector('#external').onclick=()=>window.open(u,'_blank','noopener');w.querySelector('#browserframe').innerHTML='<p>برای مشاهده این وب‌سایت، از دکمه «باز کردن در زبانه جدید» استفاده کنید.</p>'};w.querySelector('#browsergo').onclick=go;w.querySelector('#browserurl').addEventListener('keydown',e=>{if(e.key==='Enter')go()});go()}
if(id==='settings'){w.querySelector('#wallcolor').oninput=e=>{document.querySelector('.desktop').style.background=e.target.value;write('color',e.target.value)};w.querySelector('#clearnote').onclick=()=>{write('note','');toast('یادداشت‌ها پاک شدند')}}}
function updateTasks(){$('#taskapps').innerHTML=[...windows.children].map(w=>'<button class="taskapp" title="'+titles[w.dataset.window]+'" data-focus="'+w.dataset.window+'">'+ico(appIcons[w.dataset.window])+'<span class="task-label">'+titles[w.dataset.window]+'</span></button>').join('');$('#taskapps').querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=document.querySelector('[data-window="'+b.dataset.focus+'"]');w.style.display='flex';w.style.zIndex=++z})}
function renderFiles(w){const files=read('files',[{name:'خوش‌آمدید.txt',type:'file'}]);const grid=w.querySelector('#filegrid');const draw=()=>{grid.innerHTML=files.map((f,i)=>'<button class="fileitem" data-i="'+i+'"><span>'+(f.type==='folder'?'📁':'📄')+'</span>'+escapeHtml(f.name)+'</button>').join('')||'<p>این پوشه خالی است.</p>';grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=files[+b.dataset.i];if(f.type==='file')alert(f.name+'\n\nاین یک فایل نمونه در فضای ذخیره‌سازی محلی است.')})};const add=(type)=>{const name=prompt(type==='folder'?'نام پوشه:':'نام فایل:');if(!name)return;files.push({name,type});write('files',files);draw()};w.querySelector('#newfile').onclick=()=>add('file');w.querySelector('#newfolder').onclick=()=>add('folder');draw()}
function wireCalc(w){let expr='0';const d=w.querySelector('#calcdisplay');const show=()=>d.value=expr;w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='C')expr='0';else if(k==='⌫')expr=expr.length>1?expr.slice(0,-1):'0';else if(k==='='){try{const safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/(). -]+$/.test(safe))throw 0;const result=Function('return ('+safe+')')();expr=Number.isFinite(result)?String(+result.toFixed(8)):'خطا'}catch{expr='خطا'}}else if(k==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else expr=expr==='0'?k:k==='×'||k==='÷'||k==='+'||k==='−'?expr+k:expr+k;show()})}
$('#startbtn').innerHTML=ico('start');$('#searchbtn').innerHTML=ico('search');$('#viewbtn').innerHTML=ico('view');document.querySelector('.tray-icons').innerHTML=ico('wifi')+ico('volume')+ico('battery');document.querySelectorAll('.deskicon').forEach(b=>{const id=b.dataset.app;b.innerHTML='<span>'+ico(appIcons[id])+'</span>'+titles[id]});document.querySelectorAll('.appitem').forEach(b=>{const id=b.dataset.app;b.innerHTML='<span>'+ico(appIcons[id])+'</span>'+titles[id]});$('#searchbtn').onclick=()=>{openApp('browser');toast('مرورگر برای جست‌وجو باز شد')};$('#viewbtn').onclick=()=>{const all=[...windows.children];all.forEach((w,i)=>{w.style.display='flex';w.style.zIndex=++z;w.style.left=(5+i*3)+'%';w.style.top=(5+i*3)+'%'})};$('#startbtn').onclick=()=>start.hidden=!start.hidden;document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));document.addEventListener('keydown',e=>{if(e.key==='Escape')start.hidden=true;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();openApp('explorer')}});const color=read('color',null);if(color)document.querySelector('.desktop').style.background=color;
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'})}tick();setInterval(tick,15000);
</script></body></html>
