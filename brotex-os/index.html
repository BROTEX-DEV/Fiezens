<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>BROTEX OS</title>
<style>
:root{--accent:#1686d9;--glass:rgba(20,30,48,.78);--line:#ffffff24;--task-h:66px;--fg:#f7faff}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#07182c;color:var(--fg)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}
.desktop{height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 35%,#26a8e777,transparent 38%),linear-gradient(135deg,#061b3a,#075b91 54%,#101c4c)}
.wall{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 72% 42%,#63d6ff25,transparent 35%),linear-gradient(130deg,transparent 40%,#ffffff0c 41%,transparent 62%)}
.icons{position:absolute;top:14px;right:14px;display:grid;gap:8px;z-index:1}.deskicon{width:82px;min-height:82px;padding:9px 4px;border-radius:9px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11px;text-shadow:0 2px 5px #000}.deskicon:hover,.deskicon:focus{background:#ffffff20;outline:1px solid #ffffff28}.deskicon svg{width:36px;height:36px;filter:drop-shadow(0 3px 5px #0018)}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:var(--task-h);z-index:1000;display:flex;align-items:center;justify-content:center;background:#101827d9;backdrop-filter:blur(28px) saturate(1.5);border-top:1px solid #ffffff26;box-shadow:0 -8px 30px #0002;padding:0 12px}
.task-center{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}.taskbtn,.startbtn{width:44px;height:44px;min-width:44px;border-radius:11px;background:transparent;display:grid;place-items:center;transition:.16s}.taskbtn:hover,.startbtn:hover,.taskbtn.active{background:#ffffff22;transform:translateY(-2px)}.taskbtn svg,.startbtn svg{width:23px;height:23px}
.taskapps{display:flex;align-items:center;gap:3px;max-width:48vw;overflow:auto}.taskapp{height:45px;min-width:45px;padding:0 10px;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;position:relative}.taskapp:hover,.taskapp.active{background:#ffffff20}.taskapp:after{content:"";position:absolute;bottom:3px;width:5px;height:3px;border-radius:5px;background:#60b9ff}.taskapp svg{width:22px;height:22px}.task-label{font-size:11px;white-space:nowrap}
.system-tray{position:absolute;right:13px;display:flex;align-items:center;gap:12px;height:100%}.tray-icons{display:flex;align-items:center;gap:9px}.tray-icons svg{width:16px;height:16px}.clock{font-size:11px;line-height:1.55;min-width:76px;text-align:center;cursor:pointer;padding:4px;border-radius:7px}.clock:hover{background:#ffffff18}
.startmenu,.quickpanel,.calendarpanel,.contextmenu{position:absolute;background:rgba(20,31,49,.94);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--line);box-shadow:0 20px 70px #0009;z-index:1100;border-radius:16px}.startmenu{bottom:74px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 18px));padding:19px}.startmenu[hidden],.quickpanel[hidden],.calendarpanel[hidden],.contextmenu[hidden]{display:none}
.starthead{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:bold}.starthead svg{width:23px;height:23px}.startsearch{width:100%;padding:12px 14px;border-radius:8px;background:#ffffff17;border:1px solid #ffffff28;color:white;outline:none;margin-bottom:15px}.startsearch:focus{border-color:#66baff}.startlabel{font-size:12px;color:#c4d5e9;margin:4px 0 10px}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.appitem{min-height:82px;padding:10px 5px;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px}.appitem:hover{background:#ffffff19}.appitem svg{width:29px;height:29px}
.quickpanel{bottom:74px;right:12px;width:min(330px,calc(100vw - 24px));padding:16px}.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quicktile{display:flex;align-items:center;gap:10px;padding:13px;border-radius:10px;background:#ffffff14;font-size:12px}.quicktile.on{background:#1769aa}.quicktile svg{width:19px;height:19px}.quickhint{font-size:11px;color:#c3d2e4;margin-top:12px;line-height:1.8}
.calendarpanel{bottom:74px;right:12px;width:290px;padding:16px}.calendarhead{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px}.calendarbig{font-size:30px;margin:8px 0}.calendarsmall{color:#c6d5e6;font-size:12px}
.window{position:absolute;top:9%;left:12%;width:min(760px,88vw);height:min(540px,76vh);min-width:280px;min-height:210px;background:#f5f7fb;color:#172333;border:1px solid #ffffffaa;border-radius:11px;box-shadow:0 22px 70px #0008;overflow:hidden;display:flex;flex-direction:column;resize:both;z-index:10}
.window.max{top:0!important;left:0!important;width:100%!important;height:calc(100% - var(--task-h))!important;resize:none;border-radius:0}.window.minimized{display:none}
.winhead{height:43px;flex:none;background:#e9eef5;display:flex;align-items:center;padding:0 10px;gap:10px;cursor:move;user-select:none}.winhead>svg{width:19px;height:19px;color:#31516e}.wintitle{flex:1;font-size:12px;font-weight:bold}.wincontrols{display:flex;gap:3px}.wincontrols button{width:34px;height:30px;border-radius:5px;background:transparent;color:#172333;font-size:15px}.wincontrols button:hover{background:#d5dfeb}.wincontrols button:last-child:hover{background:#e34f58;color:white}.winbody{flex:1;min-height:0;overflow:auto;padding:15px;background:#f7f9fc;color:#172333}.winbody input,.winbody textarea{color:#172333}
.ui-btn{padding:8px 12px;border-radius:7px;background:#e1eaf4;color:#17324e;font-size:12px}.ui-btn:hover{background:#d1e2f3}.primary{background:#0878d1;color:white}.primary:hover{background:#0869b7}
.explorerbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pathbar{flex:1;min-width:100px;padding:8px 10px;border:1px solid #d4deea;border-radius:7px;font-size:12px;background:white}.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}.fileitem{min-height:90px;padding:10px 5px;text-align:center;border-radius:8px;background:transparent;color:#26394d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px;overflow-wrap:anywhere}.fileitem:hover,.fileitem.selected{background:#e2effc;outline:1px solid #b6d8f5}.fileitem svg{width:32px;height:32px;color:#3378b5}.fileempty{text-align:center;color:#77889a;padding:35px 10px;font-size:13px}
.notearea{width:100%;height:calc(100% - 28px);min-height:150px;border:0;outline:0;resize:none;background:transparent;font:14px/2 Tahoma;padding:5px}.statusline{font-size:10px;color:#718096;padding:5px;border-top:1px solid #e1e7ef}
.editorbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.editorname{flex:1;font-size:12px}.editorarea{width:100%;height:calc(100% - 43px);min-height:150px;resize:none;border:1px solid #d5dfeb;border-radius:7px;padding:12px;font:13px/1.8 Consolas,monospace;outline:none;background:white}
.calc{max-width:340px;margin:5px auto}.calcdisplay{width:100%;padding:20px 14px;text-align:left;font-size:29px;border:1px solid #d1dbe7;border-radius:9px;margin-bottom:10px;background:white}.calckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calckeys button{padding:15px 4px;background:#e7edf4;border-radius:8px;color:#14283d;font-size:17px}.calckeys button:hover{background:#d6e3f0}.calckeys button.op{background:#d2e9fb}
.browserbar{display:flex;gap:7px}.browserbar input{flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}.browserhint{padding:24px;text-align:center;color:#536579;line-height:2}.browserhint svg{width:30px;height:30px;vertical-align:middle}.settingsrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #dbe3ed;font-size:13px}.wallchoices{display:flex;gap:8px;flex-wrap:wrap}.wallchoice{width:38px;height:38px;border-radius:9px;border:2px solid white}
.toast{position:absolute;bottom:78px;left:15px;background:#14263bed;padding:11px 16px;border-radius:9px;font-size:12px;z-index:1200;display:none;box-shadow:0 8px 25px #0005}
.contextmenu{min-width:180px;padding:6px}.contextmenu button{display:block;width:100%;text-align:right;padding:10px;border-radius:7px;background:transparent;font-size:12px}.contextmenu button:hover{background:#ffffff1c}
@media(max-width:650px){:root{--task-h:60px}.taskbar{justify-content:center;padding:0 6px}.system-tray{display:none}.task-center{gap:1px}.taskbtn,.startbtn{width:40px;min-width:40px;height:42px}.taskapps{max-width:48vw}.taskapp{min-width:40px;padding:0 7px}.task-label{display:none}.window{left:3%!important;top:5%!important;width:94vw!important;height:78vh!important;resize:none}.window.max{height:calc(100% - 60px)!important}.icons{top:7px;right:5px;gap:4px}.deskicon{width:67px;min-height:70px}.deskicon svg{width:31px;height:31px}.startmenu{bottom:67px}.quickpanel,.calendarpanel{bottom:67px}}
</style></head>
<body>
<main class="desktop" id="desktop"><div class="wall"></div>
<div class="icons">
<button class="deskicon" data-app="explorer"><span></span>این رایانه</button>
<button class="deskicon" data-app="notes"><span></span>یادداشت‌ها</button>
<button class="deskicon" data-app="browser"><span></span>مرورگر</button>
<button class="deskicon" data-app="calculator"><span></span>ماشین‌حساب</button>
</div>
<div id="windows"></div>
<section class="startmenu" id="startmenu" hidden><div class="starthead"><span id="startlogo"></span>BROTEX OS</div><input class="startsearch" id="startsearch" placeholder="جست‌وجوی برنامه‌ها..." autocomplete="off"><div class="startlabel">برنامه‌های سنجاق‌شده</div><div class="appgrid" id="appgrid"></div></section>
<section class="quickpanel" id="quickpanel" hidden><div class="starthead">تنظیمات سریع</div><div class="quickgrid"><button class="quicktile on" data-toggle="wifi"><span></span>وای‌فای</button><button class="quicktile on" data-toggle="bluetooth"><span></span>بلوتوث</button><button class="quicktile on" data-toggle="airplane"><span></span>حالت پرواز</button><button class="quicktile" data-toggle="night"><span></span>نور شب</button></div><div class="quickhint">این کلیدها وضعیت نمایشی محیط دسکتاپ را تغییر می‌دهند و تنظیمات واقعی دستگاه را کنترل نمی‌کنند.</div></section>
<section class="calendarpanel" id="calendarpanel" hidden><div class="calendarhead"><span>تاریخ و زمان</span><span id="calday"></span></div><div class="calendarbig" id="calclock"></div><div class="calendarsmall" id="caldate"></div></section>
<div class="contextmenu" id="contextmenu" hidden><button data-context="refresh">⟳　تازه‌سازی دسکتاپ</button><button data-context="notes">✎　یادداشت جدید</button><button data-context="settings">⚙　شخصی‌سازی</button><button data-context="about">ⓘ　درباره BROTEX OS</button></div>
<footer class="taskbar"><div class="task-center"><button class="startbtn" id="startbtn" title="شروع"></button><button class="taskbtn" id="searchbtn" title="جست‌وجو"></button><button class="taskbtn" id="viewbtn" title="نمای وظایف"></button><div class="taskapps" id="taskapps"></div></div><div class="system-tray"><button class="taskbtn" id="quickbtn" title="تنظیمات سریع"></button><div class="clock" id="clock"></div></div></footer>
<div class="toast" id="toast"></div></main>
<script>
const $=s=>document.querySelector(s),windows=$('#windows'),start=$('#startmenu');let z=20,seq=0,toastTimer;
const paths={
start:'<path d="M2 3.5 10.5 2v8H2zm10-1.7L22 0v10h-10zM2 12h8.5v8L2 18.5zm10 0h10v10l-10-1.5z"/>',
files:'<path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10l2 2h6.5A2.5 2.5 0 0 1 21 7.5v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 8h18"/>',
notes:'<path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 12h8M8 16h8"/>',
browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
calculator:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6h8M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M8 19h1m3 0h1m3 0h1"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/>',
about:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
view:'<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/>',
wifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0m-11 3.5a5 5 0 0 1 8 0M12 19h.01"/>',
volume:'<path d="M3 10v4h4l5 4V6l-5 4z"/><path d="M16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/>',
battery:'<rect x="3" y="7" width="17" height="10" rx="2"/><path d="M22 10v4M6 10h10v4H6z"/>',
bluetooth:'<path d="m7 7 10 10-5 4V3l5 4L7 17"/>',
airplane:'<path d="m2 16 20-8-8 14-2-7-10 1zm10-1 4-5"/>',
night:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"/>'
};
function ico(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[n]||paths.about)+'</svg>'}
const apps=[['explorer','این رایانه','files'],['notes','یادداشت‌ها','notes'],['browser','مرورگر','browser'],['calculator','ماشین‌حساب','calculator'],['settings','تنظیمات','settings'],['about','درباره سیستم','about']];
const titles=Object.fromEntries(apps.map(a=>[a[0],a[1]])),icons=Object.fromEntries(apps.map(a=>[a[0],a[2]]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('bxos_'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('bxos_'+k,JSON.stringify(v));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',2300)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closePanels(except){['startmenu','quickpanel','calendarpanel','contextmenu'].forEach(id=>{if(id!==except)$('#'+id).hidden=true})}
function appContent(id){
if(id==='notes')return '<textarea class="notearea" id="noteText" placeholder="یادداشت خود را بنویسید...">'+escapeHtml(read('note',''))+'</textarea><div class="statusline" id="notestatus">ذخیره خودکار روی همین دستگاه فعال است</div>';
if(id==='explorer')return '<div class="explorerbar"><button class="ui-btn primary" id="newfile">＋ فایل جدید</button><button class="ui-btn" id="newfolder">＋ پوشه جدید</button><input class="pathbar" value="این رایانه / اسناد" readonly></div><div class="filegrid" id="filegrid"></div>';
if(id==='editor')return '<div class="editorbar"><span class="editorname" id="editorname"></span><button class="ui-btn primary" id="savefile">ذخیره</button><button class="ui-btn" id="closeeditor">بستن</button></div><textarea class="editorarea" id="editorarea" spellcheck="false"></textarea>';
if(id==='calculator')return '<div class="calc"><input class="calcdisplay" id="calcdisplay" value="0" readonly><div class="calckeys">'+['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map((x,i)=>'<button class="'+([3,7,11,15,19].includes(i)?'op':'')+'" data-key="'+x+'">'+x+'</button>').join('')+'</div></div>';
if(id==='browser')return '<div class="browserbar"><input id="browserurl" value="https://example.com" placeholder="نشانی وب‌سایت"><button class="ui-btn primary" id="browsergo">رفتن</button></div><div class="browserhint">'+ico('browser')+'<br>برای باز کردن وب‌سایت‌ها از دکمه زیر استفاده کن.<br>بعضی سایت‌ها اجازه نمایش داخل پنجره را نمی‌دهند.<br><button class="ui-btn primary" id="external">باز کردن در زبانه جدید</button></div>';
if(id==='settings')return '<h3>شخصی‌سازی</h3><div class="settingsrow"><span>پس‌زمینه دسکتاپ</span><div class="wallchoices">'+['#075b91','#172554','#243b53','#365314','#7c2d12','#581c87'].map(c=>'<button class="wallchoice" data-wall="'+c+'" style="background:'+c+'"></button>').join('')+'</div></div><div class="settingsrow"><span>نمایش ساعت در نوار وظیفه</span><strong>فعال</strong></div><div class="settingsrow"><span>پاک کردن یادداشت‌ها</span><button class="ui-btn" id="clearnote">پاک کردن</button></div><div class="settingsrow"><span>بازنشانی فایل‌های نمونه</span><button class="ui-btn" id="resetfiles">بازنشانی</button></div>';
return '<div style="text-align:center;padding:30px"><div style="width:58px;height:58px;margin:auto;color:#287fc0">'+ico('about')+'</div><h2>BROTEX OS</h2><p>محیط دسکتاپ تحت وب با پنجره‌ها و ابزارهای تعاملی</p><p>نسخه 2.0 · طراحی BROTEX</p><small>این برنامه یک شبیه‌ساز دسکتاپ در مرورگر است، نه سیستم‌عامل مستقل. اطلاعات محلی در حافظه مرورگر ذخیره می‌شوند.</small></div>';
}
function openApp(id,extra){closePanels();let w=document.querySelector('[data-window="'+id+'"]');if(w){w.classList.remove('minimized');w.style.display='flex';w.style.zIndex=++z;if(id==='editor'&&extra)loadEditor(w,extra);updateTasks();return}
w=document.createElement('section');w.className='window';w.dataset.window=id;w.style.zIndex=++z;w.style.left=(10+(seq%5)*4)+'%';w.style.top=(7+(seq%5)*3)+'%';seq++;
w.innerHTML='<header class="winhead">'+ico(icons[id]||'notes')+'<span class="wintitle">'+(id==='editor'?'ویرایشگر متن':titles[id])+'</span><div class="wincontrols"><button data-act="min" title="کمینه">—</button><button data-act="max" title="بزرگ‌نمایی">□</button><button data-act="close" title="بستن">×</button></div></header><div class="winbody">'+appContent(id)+'</div>';
windows.append(w);wireWindow(w,id);if(id==='editor'&&extra)loadEditor(w,extra);updateTasks();
}
function wireWindow(w,id){
const head=w.querySelector('.winhead');let drag=null;
head.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('max'))return;drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};head.setPointerCapture(e.pointerId);w.style.zIndex=++z});
head.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-drag.x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-85,e.clientY-drag.y))+'px'});
head.addEventListener('pointerup',()=>drag=null);head.addEventListener('dblclick',()=>w.classList.toggle('max'));w.addEventListener('pointerdown',()=>w.style.zIndex=++z);
w.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(b.dataset.act==='close'){w.remove();updateTasks()}if(b.dataset.act==='min'){w.classList.add('minimized');updateTasks()}if(b.dataset.act==='max')w.classList.toggle('max')});
if(id==='notes'){const n=w.querySelector('#noteText');n.addEventListener('input',()=>{write('note',n.value);w.querySelector('#notestatus').textContent='ذخیره شد · '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})})}
if(id==='explorer')renderFiles(w);
if(id==='editor')wireEditor(w);
if(id==='calculator')wireCalc(w);
if(id==='browser'){const launch=()=>{let u=w.querySelector('#browserurl').value.trim();if(!u)return;if(!/^https?:\\/\\//i.test(u))u='https://'+u;w.querySelector('#browserurl').value=u;window.open(u,'_blank','noopener,noreferrer')};w.querySelector('#browsergo').onclick=launch;w.querySelector('#external').onclick=launch;w.querySelector('#browserurl').addEventListener('keydown',e=>{if(e.key==='Enter')launch()})}
if(id==='settings'){w.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>setWall(b.dataset.wall));w.querySelector('#clearnote').onclick=()=>{write('note','');const n=document.querySelector('[data-window="notes"] #noteText');if(n)n.value='';toast('یادداشت‌ها پاک شدند')};w.querySelector('#resetfiles').onclick=()=>{if(confirm('فایل‌های محلی به حالت اولیه برگردند؟')){write('files',[{id:'welcome',name:'خوش‌آمدید.txt',type:'file',content:'به BROTEX OS خوش آمدید!\\nاین فایل نمونه شماست.'}]);toast('فایل‌ها بازنشانی شدند')}}}
}
function updateTasks(){const visible=[...windows.children];$('#taskapps').innerHTML=visible.map(w=>'<button class="taskapp '+(w.classList.contains('minimized')?'':'active')+'" title="'+(titles[w.dataset.window]||'ویرایشگر متن')+'" data-focus="'+w.dataset.window+'">'+ico(icons[w.dataset.window]||'notes')+'<span class="task-label">'+(titles[w.dataset.window]||'ویرایشگر متن')+'</span></button>').join('');$('#taskapps').querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=document.querySelector('[data-window="'+b.dataset.focus+'"]');if(w.classList.contains('minimized')){w.classList.remove('minimized');w.style.display='flex';w.style.zIndex=++z}else if(+w.style.zIndex===z){w.classList.add('minimized')}else w.style.zIndex=++z;updateTasks()})}
function getFiles(){return read('files',[{id:'welcome',name:'خوش‌آمدید.txt',type:'file',content:'به BROTEX OS خوش آمدید!\\nاین فایل نمونه شماست.'}])}
function renderFiles(w){let files=getFiles();const grid=w.querySelector('#filegrid');function draw(){grid.innerHTML=files.map((f,i)=>'<button class="fileitem" data-i="'+i+'">'+ico(f.type==='folder'?'files':'notes')+escapeHtml(f.name)+'</button>').join('')||'<div class="fileempty">این پوشه خالی است.</div>';grid.querySelectorAll('button').forEach(b=>{b.onclick=()=>{const f=files[+b.dataset.i];if(f.type==='folder'){toast('پوشه ساخته شد؛ مدیریت پوشه‌ها در نسخه بعدی گسترش می‌یابد');return}openApp('editor',f.id)};b.oncontextmenu=e=>{e.preventDefault();const f=files[+b.dataset.i];if(confirm('فایل «'+f.name+'» حذف شود؟')){files=files.filter(x=>x.id!==f.id);write('files',files);draw();toast('فایل حذف شد')}}})}
function add(type){const name=prompt(type==='folder'?'نام پوشه را وارد کن:':'نام فایل را وارد کن:');if(!name||!name.trim())return;files.push({id:'f'+Date.now(),name:name.trim(),type,content:''});write('files',files);draw();toast(type==='folder'?'پوشه ساخته شد':'فایل ساخته شد')}
w.querySelector('#newfile').onclick=()=>add('file');w.querySelector('#newfolder').onclick=()=>add('folder');draw()}
function loadEditor(w,id){const f=getFiles().find(x=>x.id===id);if(!f){toast('فایل پیدا نشد');return}w.dataset.fileId=id;w.querySelector('#editorname').textContent=f.name;w.querySelector('#editorarea').value=f.content||''}
function wireEditor(w){w.querySelector('#savefile').onclick=()=>{const files=getFiles(),f=files.find(x=>x.id===w.dataset.fileId);if(!f)return;f.content=w.querySelector('#editorarea').value;write('files',files);toast('فایل ذخیره شد')};w.querySelector('#closeeditor').onclick=()=>{w.remove();updateTasks()}}
function wireCalc(w){let expr='0';const d=w.querySelector('#calcdisplay');function show(){d.value=expr}function calc(s){const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+*/(). -]+$/.test(t))throw Error();const tokens=t.match(/(?:\d+\.?\d*|\.\d+|[()+\-*/])/g)||[];if(tokens.join('')!==t.replace(/\s/g,''))throw Error();let p=0;function atom(){let x=tokens[p++];if(x==='('){let v=sum();if(tokens[p++]!==')')throw Error();return v}if(x==='+')return atom();if(x==='-')return -atom();if(!x||!/^(\d+\.?\d*|\.\d+)$/.test(x))throw Error();return Number(x)}function term(){let v=atom();while(tokens[p]==='*'||tokens[p]==='/'){let op=tokens[p++],n=atom();v=op==='*'?v*n:v/n}return v}function sum(){let v=term();while(tokens[p]==='+'||tokens[p]==='-'){let op=tokens[p++],n=term();v=op==='+'?v+n:v-n}return v}let v=sum();if(p!==tokens.length||!Number.isFinite(v))throw Error();return v}
w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='C')expr='0';else if(k==='⌫')expr=expr.length>1?expr.slice(0,-1):'0';else if(k==='='){try{expr=String(+calc(expr).toFixed(8))}catch{expr='خطا'}}else if(k==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else expr=expr==='0'?k:expr+k;show()})}
function setWall(c){document.querySelector('.desktop').style.background='radial-gradient(ellipse at 72% 35%,#26a8e777,transparent 38%),linear-gradient(135deg,#061b3a,'+c+' 54%,#101c4c)';write('color',c)}
function init(){
$('#startlogo').innerHTML=ico('start');$('#startbtn').innerHTML=ico('start');$('#searchbtn').innerHTML=ico('search');$('#viewbtn').innerHTML=ico('view');$('#quickbtn').innerHTML=ico('wifi')+ico('volume')+ico('battery');
document.querySelectorAll('.deskicon').forEach(b=>b.querySelector('span').innerHTML=ico(icons[b.dataset.app]));
$('#appgrid').innerHTML=apps.map(a=>'<button class="appitem" data-app="'+a[0]+'">'+ico(a[2])+a[1]+'</button>').join('');
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));
$('#startbtn').onclick=()=>{const opening=start.hidden;closePanels(opening?'startmenu':null);start.hidden=!opening;if(opening)$('#startsearch').focus()};
$('#searchbtn').onclick=()=>{closePanels();start.hidden=false;$('#startsearch').focus()};
$('#startsearch').oninput=e=>{const q=e.target.value.trim();$('#appgrid').querySelectorAll('.appitem').forEach(b=>b.hidden=!b.textContent.includes(q))};
$('#viewbtn').onclick=()=>{closePanels();const all=[...windows.children].filter(w=>!w.classList.contains('minimized'));all.forEach((w,i)=>{w.style.display='flex';w.classList.remove('max');w.style.zIndex=++z;w.style.left=(4+i*3)+'%';w.style.top=(4+i*3)+'%'})};
$('#quickbtn').onclick=()=>{const opening=$('#quickpanel').hidden;closePanels(opening?'quickpanel':null);$('#quickpanel').hidden=!opening};
document.querySelectorAll('[data-toggle]').forEach(b=>{b.querySelector('span').innerHTML=ico(b.dataset.toggle);b.onclick=()=>{b.classList.toggle('on');toast(b.textContent.trim()+' · '+(b.classList.contains('on')?'روشن':'خاموش'))}});
$('#clock').onclick=()=>{const opening=$('#calendarpanel').hidden;closePanels(opening?'calendarpanel':null);$('#calendarpanel').hidden=!opening};
document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{const v=b.dataset.context;$('#contextmenu').hidden=true;if(v==='refresh')toast('دسکتاپ تازه‌سازی شد');else openApp(v==='notes'?'notes':v==='settings'?'settings':'about')});
document.querySelector('.desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.window,.taskbar,.startmenu'))return;e.preventDefault();const m=$('#contextmenu');m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-190)+'px';m.style.top=Math.min(e.clientY,innerHeight-180)+'px'});
document.addEventListener('click',e=>{if(!e.target.closest('#contextmenu')&&!e.target.closest('.desktop'))$('#contextmenu').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();openApp('explorer')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openApp('notes')}});
const c=read('color',null);if(c)setWall(c);
}
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'});$('#calclock').textContent=d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});$('#caldate').textContent=d.toLocaleDateString('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('#calday').textContent=d.toLocaleDateString('fa-IR',{weekday:'long'})}
init();tick();setInterval(tick,15000);
</script></body></html>
